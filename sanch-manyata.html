<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>संच मान्यता — सध्या बंद</title>
<style>
body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f8fafc;
  font-family:Arial,sans-serif;
  color:#1e293b;
}
.box{
  width:min(90%,520px);
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:16px;
  padding:32px 24px;
  text-align:center;
  box-shadow:0 8px 30px rgba(0,0,0,.08);
}
.icon{font-size:48px;margin-bottom:12px}
h1{margin:0 0 12px;color:#dc2626;font-size:24px}
p{margin:8px 0;color:#64748b;line-height:1.6}
.note{margin-top:20px;padding:12px;border-radius:8px;background:#fff7ed;color:#9a3412;font-size:14px}
</style>
</head>
<body>
<div class="box">
  <div class="icon">⏸️</div>
  <h1>संच मान्यता मॉड्यूल सध्या बंद आहे</h1>
  <p>हे मॉड्यूल सध्या उपलब्ध नाही.</p>
  <div class="note">दुरुस्ती / सुधारणा पूर्ण झाल्यानंतर हे मॉड्यूल पुन्हा सुरू केले जाईल.</div>
</div>
</body>
</html>
