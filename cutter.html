<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSC / HSC फोटो व सही कटर | डिजिटल साथीदार</title>
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Mukta', sans-serif; }
        body { background: #f8fafc; color: #0f172a; padding: 14px; font-size: 14px; display: flex; flex-direction: column; height: 100vh; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .back-btn { text-decoration: none; background: #ffffff; border: 1px solid #cbd5e1; padding: 5px 12px; border-radius: 6px; font-weight: 700; color: #1e40af; }
        .back-btn:hover { background: #eff6ff; }
        .cutter-bar { background: #ffffff; padding: 8px 14px; border: 1px solid #cbd5e1; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
        .btn-ui { padding: 6px 12px; font-size: 13px; font-weight: 700; border-radius: 6px; border: none; cursor: pointer; }
        .btn-primary { background: #1e40af; color: #fff; }
        .btn-success { background: #059669; color: #fff; }
        .btn-danger { background: #e11d48; color: #fff; }
        .btn-outline { background: #fff; border: 1px solid #cbd5e1; color: #334155; }
        .cutter-viewport { background: #1e293b; padding: 12px; border-radius: 8px; display: flex; justify-content: center; align-items: flex-start; overflow: auto; flex: 1; border: 1px solid #334155; }
        #canvasWrapper { position: relative; background: white; box-shadow: 0 6px 20px rgba(0,0,0,0.5); display: inline-block; }
        #scannedDoc { display: block; width: 850px; max-width: none; height: auto; user-select: none; pointer-events: none; }
        .crop-box { position: absolute; border: 2px solid; cursor: move; display: flex; justify-content: space-between; align-items: flex-start; box-sizing: border-box; padding: 2px; border-radius: 3px; }
        .crop-box.photo-box { border-color: #2563eb; background: rgba(37, 99, 235, 0.22); }
        .crop-box.sign-box { border-color: #059669; background: rgba(5, 150, 105, 0.22); }
        .box-label { background: #0f172a; color: #fff; font-size: 11px; font-weight: 600; padding: 1px 4px; border-radius: 2px; pointer-events: none; }
        .box-close { background: #e11d48; color: white; border: none; border-radius: 50%; width: 15px; height: 15px; font-size: 9px; cursor: pointer; }
        .resize-handle { position: absolute; width: 9px; height: 9px; background: #ffffff; border: 2px solid #0f172a; bottom: -4px; right: -4px; cursor: se-resize; }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="index.html" class="back-btn">⬅️ मुख्य पानावर परत जा (Home)</a>
        <div style="font-weight: 800; font-size: 16px; color: #1e40af;">SSC / HSC परीक्षा फॉर्म - फोटो व सही कटर</div>
    </div>

    <div class="cutter-bar">
        <input type="file" id="cutterFileInput" accept="image/*" style="display:none;">
        <button class="btn-ui btn-primary" onclick="document.getElementById('cutterFileInput').click()">📁 ९ फोटो आणि सही नमुना अपलोड करा</button>
        <button class="btn-ui btn-outline" onclick="autoDetectBoxes()">🤖 ऑटो डिटेक्ट</button>
        <button class="btn-ui btn-outline" onclick="addNewBox('photo')">+ फोटो</button>
        <button class="btn-ui btn-outline" onclick="addNewBox('sign')">+ सही</button>
        <button class="btn-ui btn-outline" onclick="zoomCutter(1.15)">🔍+ मोठे करा</button>
        <button class="btn-ui btn-outline" onclick="zoomCutter(0.85)">🔍- लहान करा</button>
        <button class="btn-ui btn-danger" onclick="clearAllBoxes()">रिसेट</button>

        <span style="font-size:12px; font-weight:700; padding:5px 10px; background:#f1f5f9; border-radius:6px; border:1px solid #cbd5e1;">
            फोटो: <span id="photoCount" style="color:#2563eb;">0</span> | सह्या: <span id="signCount" style="color:#059669;">0</span>
        </span>

        <button class="btn-ui btn-success" onclick="cropAndDownloadAll()">📦 सर्व ZIP डाऊनलोड करा</button>
    </div>

    <div class="cutter-viewport">
        <div id="canvasWrapper">
            <img id="scannedDoc" src="" alt="कृपया आधी '९ फोटो आणि सही नमुना अपलोड करा' वर क्लिक करा">
            <div id="boxesContainer"></div>
        </div>
    </div>

<script>
    let currentCutterWidth = 850;
    function zoomCutter(factor) {
        const doc = document.getElementById('scannedDoc');
        if (!doc.src || doc.naturalWidth === 0) return;
        currentCutterWidth = Math.max(500, Math.min(2200, currentCutterWidth * factor));
        doc.style.width = currentCutterWidth + 'px';
    }

    let photoCounter = 0, signCounter = 0;
    const boxesContainer = document.getElementById('boxesContainer');
    const scannedDoc = document.getElementById('scannedDoc');

    document.getElementById('cutterFileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(event) {
            scannedDoc.src = event.target.result;
            scannedDoc.onload = function() { clearAllBoxes(); };
        };
        reader.readAsDataURL(file);
    });

    function createBoxElement(type, idNumber, top, left, width, height) {
        const box = document.createElement('div');
        box.className = `crop-box ${type}-box`;
        box.dataset.type = type;
        box.dataset.id = idNumber;
        box.style.top = top + 'px';
        box.style.left = left + 'px';
        box.style.width = width + 'px';
        box.style.height = height + 'px';
        const labelName = type === 'photo' ? `Photo ${idNumber}` : `Sign ${idNumber}`;
        box.innerHTML = `<span class="box-label">${labelName}</span><button class="box-close" onclick="removeSpecificBox(this)">✕</button><div class="resize-handle"></div>`;
        const handle = box.querySelector('.resize-handle');
        makeDraggableAndResizable(box, handle);
        boxesContainer.appendChild(box);
        updateCounters();
    }

    function addNewBox(type) {
        if (!scannedDoc.src || scannedDoc.naturalWidth === 0) { alert("कृपया आधी नमुना अपलोड करा!"); return; }
        if (type === 'photo') { photoCounter++; createBoxElement('photo', photoCounter, 30, 30, 100, 125); }
        else { signCounter++; createBoxElement('sign', signCounter, 30, 30, 100, 40); }
    }

    function autoDetectBoxes() {
        if (!scannedDoc.src || scannedDoc.naturalWidth === 0) { alert("कृपया आधी नमुना अपलोड करा!"); return; }
        clearAllBoxes();
        const displayW = scannedDoc.clientWidth;
        const displayH = scannedDoc.clientHeight;
        const colRatios = [0.08, 0.38, 0.68];
        const rowRatios = [0.14, 0.35, 0.56];
        const photoW = displayW * 0.14;
        const photoH = photoW * 1.25;
        const signW = photoW;
        const signH = photoW * 0.45;
        let pCount = 0, sCount = 0;
        for (let r = 0; r < rowRatios.length; r++) {
            for (let c = 0; c < colRatios.length; c++) {
                if (pCount >= 9) break;
                const left = displayW * colRatios[c];
                const topP = displayH * rowRatios[r];
                const topS = topP + photoH + 8;
                pCount++; sCount++;
                createBoxElement('photo', pCount, topP, left, photoW, photoH);
                createBoxElement('sign', sCount, topS, left, signW, signH);
            }
        }
    }

    window.removeSpecificBox = function(btn) { btn.closest('.crop-box').remove(); updateCounters(); };
    function clearAllBoxes() { boxesContainer.innerHTML = ''; photoCounter = 0; signCounter = 0; updateCounters(); }
    function updateCounters() {
        document.getElementById('photoCount').innerText = document.querySelectorAll('.crop-box.photo-box').length;
        document.getElementById('signCount').innerText = document.querySelectorAll('.crop-box.sign-box').length;
    }

    function makeDraggableAndResizable(el, handle) {
        let isDragging = false, isResizing = false, startX, startY, startWidth, startHeight, startLeft, startTop;
        el.addEventListener('mousedown', function(e) {
            if (e.target === handle || e.target.classList.contains('box-close')) return;
            isDragging = true; startX = e.clientX; startY = e.clientY; startLeft = el.offsetLeft; startTop = el.offsetTop; e.preventDefault();
        });
        handle.addEventListener('mousedown', function(e) {
            isResizing = true; startX = e.clientX; startY = e.clientY;
            startWidth = parseInt(document.defaultView.getComputedStyle(el).width, 10);
            startHeight = parseInt(document.defaultView.getComputedStyle(el).height, 10);
            e.stopPropagation(); e.preventDefault();
        });
        window.addEventListener('mousemove', function(e) {
            if (isDragging) { el.style.left = (startLeft + (e.clientX - startX)) + 'px'; el.style.top = (startTop + (e.clientY - startY)) + 'px'; }
            if (isResizing) { el.style.width = Math.max(30, (startWidth + (e.clientX - startX))) + 'px'; el.style.height = Math.max(20, (startHeight + (e.clientY - startY))) + 'px'; }
        });
        window.addEventListener('mouseup', function() { isDragging = false; isResizing = false; });
    }

    async function cropAndDownloadAll() {
        const boxes = document.querySelectorAll('.crop-box');
        if (boxes.length === 0) { alert("क्रॉप करण्यासाठी एकही बॉक्स उपलब्ध नाही!"); return; }
        const zip = new JSZip();
        const scaleX = scannedDoc.naturalWidth / scannedDoc.clientWidth;
        const scaleY = scannedDoc.naturalHeight / scannedDoc.clientHeight;
        const originalImg = new Image();
        originalImg.src = scannedDoc.src;
        await originalImg.decode();

        let index = 1;
        for (let box of boxes) {
            const type = box.dataset.type;
            const id = box.dataset.id || index;
            const fileName = `${type}_${id}.jpg`;
            const bLeft = box.offsetLeft * scaleX;
            const bTop = box.offsetTop * scaleY;
            const bWidth = box.offsetWidth * scaleX;
            const bHeight = box.offsetHeight * scaleY;
            const canvas = document.createElement('canvas');
            canvas.width = bWidth; canvas.height = bHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(originalImg, bLeft, bTop, bWidth, bHeight, 0, 0, bWidth, bHeight);
            let blob = await compressToTargetSize(canvas, 25, 40);
            zip.file(fileName, blob);
            index++;
        }
        zip.generateAsync({ type: "blob" }).then(content => saveAs(content, "SSC_HSC_Board_Photos_Signs.zip"));
    }

    function compressToTargetSize(canvas, minKB, maxKB) {
        return new Promise((resolve) => {
            let quality = 0.90;
            function attempt() {
                canvas.toBlob((blob) => {
                    let sizeKB = blob.size / 1024;
                    if (sizeKB > maxKB && quality > 0.1) { quality -= 0.08; attempt(); }
                    else { resolve(blob); }
                }, 'image/jpeg', quality);
            }
            attempt();
        });
    }
</script>
</body>
</html>
