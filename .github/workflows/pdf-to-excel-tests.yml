name: PDF to Excel checks

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "pdf-to-excel.html"
      - "PDF-TO-EXCEL-SETUP.md"
      - ".github/workflows/pdf-to-excel-tests.yml"
  push:
    branches: [feature/pdf-to-excel]
    paths:
      - "backend/**"
      - ".github/workflows/pdf-to-excel-tests.yml"

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install OCR system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-mar
      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q backend
      - name: Run helper tests
        run: python -m unittest discover -s backend/tests -v
      - name: Check OCR language availability
        run: |
          tesseract --list-langs
          python -c "import pytesseract; langs=pytesseract.get_languages(config=''); assert 'eng' in langs and 'mar' in langs, langs"
